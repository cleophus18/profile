<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>logo preview</title>
    <style>
      body {
        margin: 0;
        background: #02070d;
        display: flex;
        gap: 40px;
        padding: 40px;
        align-items: center;
      }
      .box {
        display: grid;
        gap: 10px;
        justify-items: center;
        color: #3b9df0;
        font: 11px monospace;
      }
      img {
        width: var(--s);
        height: var(--s);
      }
    </style>
  </head>
  <body>
    <div class="box" style="--s: 180px">
      <img src="../profile/src/assets/ct-tech-logo.svg" /><span>180px</span>
    </div>
    <div class="box" style="--s: 96px">
      <img src="../profile/src/assets/ct-tech-logo.svg" /><span>96px</span>
    </div>
    <div class="box" style="--s: 48px">
      <img src="../profile/src/assets/ct-tech-logo.svg" /><span>48px</span>
    </div>
    <div class="box" style="--s: 28px">
      <img src="../profile/src/assets/ct-tech-logo.svg" /><span>28px</span>
    </div>
  </body>
</html>
